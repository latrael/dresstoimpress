name: dress_to_impress
description: Niche clothing discovery app.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  animations: 3.0.0
  http: ^1.2.2
  shared_preferences: ^2.3.2
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/demo-products.json
  fonts:
    - family: NicheIconsRegular
      fonts:
        - asset: assets/icons/Phosphor.ttf
    - family: NicheIconsFill
      fonts:
        - asset: assets/icons/Phosphor-Fill.ttf
    - family: YoungSerif
      fonts:
        - asset: assets/fonts/YoungSerif-Regular.ttf
          weight: 400
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Regular.ttf
          weight: 400
        - asset: assets/fonts/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700

# App icon: the Niche "Arch" mark (assets/icon/make_icon.py renders the PNGs).
# Regenerate with: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/icon-1024.png"
  adaptive_icon_background: "#5B1F33"
  adaptive_icon_foreground: "assets/icon/icon-fg.png"
  web:
    generate: true
    image_path: "assets/icon/icon-1024.png"
    background_color: "#5B1F33"
    theme_color: "#5B1F33"
