name: dress_to_impress
description: Niche clothing discovery app.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  shared_preferences: ^2.3.2
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/demo-products.json

# App icon: the Niche "Arch" mark (assets/icon/make_icon.py renders the PNGs).
# Regenerate with: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/icon-1024.png"
  adaptive_icon_background: "#5B1F33"
  adaptive_icon_foreground: "assets/icon/icon-fg.png"
  web:
    generate: true
    image_path: "assets/icon/icon-1024.png"
    background_color: "#5B1F33"
    theme_color: "#5B1F33"
